name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Read the pin instead of restating its major. A hardcoded `22` is why CI stayed
          # green while the Cloudflare build failed: Vite needs module.registerHooks from
          # 22.15, .nvmrc carried 22.14, and nothing that read .nvmrc ever ran here.
          node-version-file: ".nvmrc"
          cache: npm
      - run: npm ci
      - run: npx astro sync
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
